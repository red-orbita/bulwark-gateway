# ============================================================
# ArgoCD Application — Bulwark Gateway secrets (SealedSecrets)
#
# Deploys the SealedSecret CRs. The SealedSecrets controller decrypts them into
# the plain Secrets the app expects (bulwark-proxy-secrets, bulwark-admin-secrets,
# bulwark-redis-secrets, bulwark-monitoring-secrets).
#
# PREREQUISITES (see deploy/argocd/README.md):
#   1. SealedSecrets controller installed in the target cluster.
#   2. k8s/secrets/sealed-secrets.yaml regenerated FOR THIS CLUSTER:
#        ./secrets/init.sh
#        NAMESPACE=bulwark-gateway ./k8s/secrets/generate-sealed-secrets.sh
#      (the committed file only decrypts in the cluster that sealed it).
#
# Sync-wave -1: secrets are created before the chart (bulwark-gateway) syncs.
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bulwark-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # -- CHANGE to your fork/mirror if different
    repoURL: https://github.com/red-orbita/bulwark-gateway.git
    targetRevision: v1.0.0
    path: k8s/secrets
    directory:
      recurse: false
      # Only apply the sealed secrets, not the generator scripts
      include: 'sealed-secrets.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: bulwark-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
