{{- /*
  SECURITY FIX (VULN 2.1): Generate all random values ONCE at the top and reuse.
  Each randAlphaNum call generates a DIFFERENT value per template render.
  Without this fix, proxy, admin, and redis get different passwords on fresh install.
  UPGRADE FIX: Use lookup to preserve existing secrets across helm upgrade.

  GITOPS: When .Values.secrets.create is false, the chart renders NO Secret
  objects. Secrets are then managed externally (SealedSecrets / External Secrets
  Operator / pre-created Secret). This is required for ArgoCD/Flux, whose
  client-side `helm template` cannot use `lookup`, which would otherwise
  regenerate random credentials on every sync (permanent drift + credential
  rotation). See deploy/argocd/ and docs/DEPLOYMENT.md (GitOps section).
*/ -}}
{{- if .Values.secrets.create -}}
{{- $existingProxy := (lookup "v1" "Secret" (include "bulwark-gateway.namespace" .) "bulwark-proxy-secrets") -}}
{{- $existingAdmin := (lookup "v1" "Secret" (include "bulwark-gateway.namespace" .) "bulwark-admin-secrets") -}}
{{- $existingRedis := (lookup "v1" "Secret" (include "bulwark-gateway.namespace" .) "bulwark-redis-secrets") -}}
{{- $redisPassword := "" -}}
{{- if and $existingRedis $existingRedis.data (index $existingRedis.data "redis-password") }}
{{- $redisPassword = (index $existingRedis.data "redis-password" | b64dec) -}}
{{- else }}
{{- $redisPassword = (.Values.redis.password | default (randAlphaNum 32)) -}}
{{- end -}}
{{- $jwtSecret := "" -}}
{{- if and $existingProxy $existingProxy.data (index $existingProxy.data "jwt-secret") }}
{{- $jwtSecret = (index $existingProxy.data "jwt-secret" | b64dec) -}}
{{- else }}
{{- $jwtSecret = (.Values.secrets.jwtSecret | default (randAlphaNum 64)) -}}
{{- end -}}
{{- /*
  Admin JWT secret. Distinct from the proxy jwt-secret so a leaked proxy token
  can never be replayed against the admin API (defense-in-depth; aud/iss already
  differ). UPGRADE-SAFE: preserve any already-persisted admin-jwt-secret so
  existing admin sessions keep validating; only fresh installs get a new key.
*/ -}}
{{- $adminJwtSecret := "" -}}
{{- if and $existingAdmin $existingAdmin.data (index $existingAdmin.data "admin-jwt-secret") }}
{{- $adminJwtSecret = (index $existingAdmin.data "admin-jwt-secret" | b64dec) -}}
{{- else }}
{{- $adminJwtSecret = (.Values.secrets.adminJwtSecret | default (randAlphaNum 64)) -}}
{{- end -}}
{{- $apiKey := "" -}}
{{- if and $existingProxy $existingProxy.data (index $existingProxy.data "api-keys") }}
{{- $apiKey = (index $existingProxy.data "api-keys" | b64dec) -}}
{{- else }}
{{- $apiKey = (.Values.secrets.apiKey | default (randAlphaNum 48)) -}}
{{- end -}}
{{- $adminPassword := "" -}}
{{- if and $existingAdmin $existingAdmin.data (index $existingAdmin.data "admin-password") }}
{{- $adminPassword = (index $existingAdmin.data "admin-password" | b64dec) -}}
{{- else }}
{{- $adminPassword = (.Values.secrets.adminPassword | default (randAlphaNum 24)) -}}
{{- end -}}
{{- $securityPassword := "" -}}
{{- if and $existingAdmin $existingAdmin.data (index $existingAdmin.data "security-password") }}
{{- $securityPassword = (index $existingAdmin.data "security-password" | b64dec) -}}
{{- else }}
{{- $securityPassword = (.Values.secrets.securityPassword | default (randAlphaNum 24)) -}}
{{- end -}}
{{- $auditorPassword := "" -}}
{{- if and $existingAdmin $existingAdmin.data (index $existingAdmin.data "auditor-password") }}
{{- $auditorPassword = (index $existingAdmin.data "auditor-password" | b64dec) -}}
{{- else }}
{{- $auditorPassword = (.Values.secrets.auditorPassword | default (randAlphaNum 24)) -}}
{{- end -}}
{{- $dbEncryptionKey := "" -}}
{{- if and $existingAdmin $existingAdmin.data (index $existingAdmin.data "db-encryption-key") }}
{{- $dbEncryptionKey = (index $existingAdmin.data "db-encryption-key" | b64dec) -}}
{{- else }}
{{- $dbEncryptionKey = (.Values.secrets.dbEncryptionKey | default (randAlphaNum 32)) -}}
{{- end -}}
{{- /*
  Virtual-key encryption key (GAP-G). MUST be identical across proxy and admin
  (they encrypt/decrypt the same bulwark:vkeys:* vault) and MUST be distinct
  from the JWT secret. Prefer an already-persisted value from either secret so
  the vault stays decryptable across upgrades.
*/ -}}
{{- $keyEncryptionKey := "" -}}
{{- if and $existingAdmin $existingAdmin.data (index $existingAdmin.data "key-encryption-key") }}
{{- $keyEncryptionKey = (index $existingAdmin.data "key-encryption-key" | b64dec) -}}
{{- else if and $existingProxy $existingProxy.data (index $existingProxy.data "key-encryption-key") }}
{{- $keyEncryptionKey = (index $existingProxy.data "key-encryption-key" | b64dec) -}}
{{- else }}
{{- $keyEncryptionKey = (.Values.secrets.keyEncryptionKey | default (randAlphaNum 48)) -}}
{{- end -}}
---
# Proxy Secrets — auto-generates random values if not provided
apiVersion: v1
kind: Secret
metadata:
  name: bulwark-proxy-secrets
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-secret: {{ $jwtSecret | b64enc | quote }}
  api-keys: {{ $apiKey | b64enc | quote }}
  key-encryption-key: {{ $keyEncryptionKey | b64enc | quote }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ $redisPassword | b64enc | quote }}
  {{- else if and .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- else }}
  redis-password: {{ "" | b64enc | quote }}
  {{- end }}
  # Placeholder keys for threat intel feeds (configure post-install)
  urlhaus-key: {{ "" | b64enc | quote }}
  threatfox-key: {{ "" | b64enc | quote }}
  otx-key: {{ "" | b64enc | quote }}
  abuseipdb-key: {{ "" | b64enc | quote }}
---
# Admin Secrets
apiVersion: v1
kind: Secret
metadata:
  name: bulwark-admin-secrets
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.admin.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-jwt-secret: {{ $adminJwtSecret | b64enc | quote }}
  admin-password: {{ $adminPassword | b64enc | quote }}
  security-password: {{ $securityPassword | b64enc | quote }}
  auditor-password: {{ $auditorPassword | b64enc | quote }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ $redisPassword | b64enc | quote }}
  {{- else if and .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- else }}
  redis-password: {{ "" | b64enc | quote }}
  {{- end }}
  api-keys: {{ $apiKey | b64enc | quote }}
  db-encryption-key: {{ $dbEncryptionKey | b64enc | quote }}
  key-encryption-key: {{ $keyEncryptionKey | b64enc | quote }}
{{- if .Values.redis.enabled }}
---
# Redis Secrets (internal Redis only)
apiVersion: v1
kind: Secret
metadata:
  name: bulwark-redis-secrets
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.redis.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  redis-password: {{ $redisPassword | b64enc | quote }}
{{- end }}
{{- if and (not .Values.redis.enabled) .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
---
# External Redis Secret (password provided inline)
apiVersion: v1
kind: Secret
metadata:
  name: bulwark-redis-secrets
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-redis
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
{{- end }}
{{- if .Values.monitoring.grafana.enabled }}
---
# Monitoring Secrets
apiVersion: v1
kind: Secret
metadata:
  name: bulwark-monitoring-secrets
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  grafana-password: {{ (.Values.monitoring.grafana.adminPassword | default (randAlphaNum 16)) | b64enc | quote }}
{{- end }}
{{- end }}
