{{- include "bulwark-gateway.validateValues" . }}
---
# Proxy ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bulwark-proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Proxy Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  strategy:
    {{- if or (eq .Values.telemetry.outbox.mode "local-durable") .Values.proxy.attachments.service.enabled }}
    # No overlapping exporters may drain the local SQLite outbox.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: bulwark-gateway
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/health/metrics"
        checksum/config: "{{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 8 }}"
        checksum/secrets: "{{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum | trunc 8 }}"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: bulwark-proxy
      automountServiceAccountToken: false
      # DNS: lower ndots so fully-qualified in-cluster names (backend/redis
      # "*.svc.cluster.local", 4 dots) resolve as absolute on the first query
      # instead of being treated as relative under the default ndots:5 (which
      # appends every search domain first and can add multi-second per-connection
      # latency on clusters with slow/leaked search domains).
      dnsConfig:
        options:
          - name: ndots
            value: "{{ .Values.proxy.dnsNdots | default "2" }}"
      {{- if .Values.proxy.scheduling.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.proxy.scheduling.podAntiAffinity.type "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 20 }}
                topologyKey: topology.kubernetes.io/zone
          {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- end }}
      {{- if .Values.proxy.scheduling.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.proxy.scheduling.topologySpreadConstraints.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.proxy.scheduling.topologySpreadConstraints.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Distroless nonroot UID/GID. On upgrade from the pre-distroless image
        # (UID 999), fsGroup + fsGroupChangePolicy: Always re-chowns existing
        # PVCs to GID 65532 on mount so the proxy can write shared/enrichment data.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: Always
        seccompProfile:
          {{- if .Values.proxy.seccomp.localhost }}
          type: Localhost
          localhostProfile: {{ .Values.proxy.seccomp.localhostProfile }}
          {{- else }}
          type: RuntimeDefault
          {{- end }}
      initContainers:
        {{- if eq .Values.telemetry.outbox.mode "shared-postgresql" }}
        - name: validate-outbox-postgresql
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import importlib.util, ipaddress, os, ssl, sys
              from pathlib import Path
              from urllib.parse import urlsplit

              # Freeze the exact secret consumed by the proxy: no SQLite URL or
              # secret rotation may bypass the PostgreSQL-only contract.
              try:
                  source = Path("/run/outbox-source")
                  target = Path("/run/outbox-pg")
                  with (source / "postgresql-url").open("rb") as stream:
                      raw = stream.read(8193)
                  if not raw or len(raw) > 8192:
                      raise ValueError("invalid URL size")
                  url = raw.decode("utf-8").strip()
                  parsed = urlsplit(url)
                  if (parsed.scheme not in {"postgresql", "postgresql+asyncpg", "postgres"}
                          or parsed.hostname != os.environ["PG_HOST"]
                          or (parsed.port or 5432) != int(os.environ["PG_PORT"])
                          or not parsed.username or not parsed.password
                          or parsed.path in {"", "/"} or parsed.query or parsed.fragment
                          or any(ord(c) < 33 for c in url)):
                      raise ValueError("invalid PostgreSQL URL")
                  cidr = os.environ["PG_CIDR"]
                  if cidr:
                      network = ipaddress.ip_network(cidr, strict=True)
                      try:
                          host_ip = ipaddress.ip_address(parsed.hostname)
                      except ValueError:
                          host_ip = None
                      if host_ip is not None and host_ip not in network:
                          raise ValueError("host outside PostgreSQL CIDR")
                  if importlib.util.find_spec("asyncpg") is None:
                      raise ValueError("runtime must include asyncpg")
                  ca = source / "ca.crt"
                  if ca.exists():
                      with ca.open("rb") as stream:
                          pem = stream.read(1048577)
                      if not pem or len(pem) > 1048576:
                          raise ValueError("invalid CA size")
                      ssl.create_default_context(cadata=pem.decode("ascii"))
                      (target / "ca.crt").write_bytes(pem)
                  (target / "postgresql-url").unlink(missing_ok=True)
                  (target / "postgresql-url").write_text(url, encoding="utf-8")
                  (target / "postgresql-url").chmod(0o400)
              except Exception:
                  sys.exit("Invalid shared PostgreSQL provisioning; refusing startup")
          env:
            - name: PG_HOST
              value: {{ .Values.telemetry.outbox.postgresql.host | quote }}
            - name: PG_PORT
              value: {{ .Values.telemetry.outbox.postgresql.port | quote }}
            - name: PG_CIDR
              value: {{ .Values.telemetry.outbox.postgresql.egress.cidr | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          volumeMounts:
            - name: outbox-pg-secret
              mountPath: /run/outbox-source
              readOnly: true
            - name: outbox-pg-config
              mountPath: /run/outbox-pg
        {{- end }}
        - name: init-policies
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          # Distroless has no shell/coreutils; use the bundled Python to seed
          # policies into the PVC (no-clobber, mirrors `cp -rn`).
          command:
            - python3
            - -c
            - |
              import shutil, pathlib
              src = pathlib.Path("/app/config/policies")
              dst = pathlib.Path("/policies")
              if src.is_dir():
                  for p in src.rglob("*"):
                      target = dst / p.relative_to(src)
                      if p.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      elif not target.exists():
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(p, target)
              print("policies seeded")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policies
              mountPath: /policies
        {{- if .Values.proxy.ml.enabled }}
        - name: init-models
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          # Distroless has no shell/sha256sum; use the bundled Python (hashlib)
          # for presence checks and SHA-256 integrity verification.
          command:
            - python3
            - -c
            - |
              import hashlib, sys
              from pathlib import Path

              print("Checking ML models...")
              models = "{{ join " " .Values.proxy.ml.models }}".split()
              for model in models:
                  base = Path("/models") / model
                  if (base / "model.onnx").is_file():
                      print(f"  Model '{model}' already present")
                  elif (base / "model.safetensors").is_file():
                      print(f"  Model '{model}' already present (safetensors)")
                  else:
                      print(f"  Model '{model}' not found - will run without it (graceful degradation)")

              def verify(name, path, expected):
                  f = Path(path)
                  if not f.is_file():
                      return
                  h = hashlib.sha256()
                  with open(f, "rb") as fh:
                      for chunk in iter(lambda: fh.read(1048576), b""):
                          h.update(chunk)
                  actual = h.hexdigest()
                  if actual != expected:
                      print(f"FATAL: {name} checksum mismatch! Expected={expected} Got={actual}")
                      sys.exit(1)
                  print(f"  Integrity verified: {name} ({actual})")

              {{- if .Values.proxy.mlModels.checksums.injection_classifier }}
              verify("injection-classifier", "/models/injection-classifier/model.safetensors", "{{ .Values.proxy.mlModels.checksums.injection_classifier }}")
              {{- end }}
              {{- if .Values.proxy.mlModels.checksums.toxicity }}
              verify("toxicity", "/models/toxicity/model.safetensors", "{{ .Values.proxy.mlModels.checksums.toxicity }}")
              {{- end }}
              print("Model check complete")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ml-models
              mountPath: /models
        {{- end }}
        {{- if .Values.proxy.enrichment.enabled }}
        - name: init-enrichment-model
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import hashlib, json, os, shutil, stat, sys
              from pathlib import Path, PurePosixPath

              try:
                  manifest = json.loads(os.environ["MODEL_MANIFEST"])
                  source = Path("/provisioned-model")
                  target = Path("/app/verified-enrichment")
                  budget = int(os.environ["MODEL_MAX_BYTES"])
                  # EmptyDir survives retries. Only verified manifest-listed
                  # bytes enter the runtime view, never unlisted source files.
                  for old in target.iterdir():
                      if old.is_dir() and not old.is_symlink():
                          shutil.rmtree(old)
                      else:
                          old.unlink()
                  for name, expected in manifest.items():
                      relative = PurePosixPath(name)
                      if relative.is_absolute() or ".." in relative.parts:
                          raise ValueError("invalid model path")
                      src = source / relative
                      if any(p.is_symlink() for p in [src, *src.parents]):
                          raise ValueError("model symlinks are forbidden")
                      dst = target / relative
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      digest = hashlib.sha256()
                      fd = os.open(src, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                      with os.fdopen(fd, "rb") as reader, dst.open("wb") as writer:
                          if not stat.S_ISREG(os.fstat(reader.fileno()).st_mode):
                              raise ValueError("model asset must be a regular file")
                          while chunk := reader.read(1048576):
                              budget -= len(chunk)
                              if budget < 0:
                                  raise ValueError("model byte budget exceeded")
                              digest.update(chunk)
                              writer.write(chunk)
                      if digest.hexdigest() != expected.lower():
                          raise ValueError("model checksum mismatch")
                  print("Preprovisioned enrichment model verified; no downloads")
              except Exception:
                  sys.exit("Invalid enrichment model provisioning; refusing startup")
          env:
            - name: MODEL_MANIFEST
              value: {{ .Values.proxy.enrichment.modelManifest | toJson | quote }}
            - name: MODEL_MAX_BYTES
              value: {{ .Values.proxy.enrichment.modelMaxBytes | int64 | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
            requests:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: enrichment-model-source
              mountPath: /provisioned-model
              readOnly: true
            - name: enrichment-model-verified
              mountPath: /app/verified-enrichment
        {{- end }}
      containers:
        - name: proxy
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: proxy-config
          resources:
            {{- if .Values.proxy.ml.enabled }}
            {{- toYaml .Values.proxy.ml.resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.proxy.resources | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              {{- if .Values.proxy.seccomp.localhost }}
              type: Localhost
              localhostProfile: {{ .Values.proxy.seccomp.localhostProfile }}
              {{- else }}
              type: RuntimeDefault
              {{- end }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            {{- if and .Values.proxy.attachments.service.enabled (eq .Values.proxy.attachments.service.storage "local-sqlite") }}
            - name: attachment-data
              mountPath: /app/attachments
            - name: attachment-config
              mountPath: /run/attachment-config
              readOnly: true
            {{- end }}
            {{- if eq .Values.telemetry.outbox.mode "shared-postgresql" }}
            - name: outbox-pg-config
              mountPath: /run/outbox-pg
              readOnly: true
            {{- end }}
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.existingSecret }}
            - name: redis-external-secret
              mountPath: /run/secrets/redis-password
              subPath: {{ include "bulwark-gateway.redis.secretKey" . }}
              readOnly: true
            {{- end }}
            - name: policies
              mountPath: /app/config/policies
              readOnly: true
            - name: notifications-data
              mountPath: /app/shared/notifications
              readOnly: true
            - name: admin-data
              mountPath: /app/shared/admin
              readOnly: true
            {{- if .Values.proxy.ml.enabled }}
            - name: ml-models
              mountPath: {{ .Values.proxy.ml.modelDir }}
              readOnly: true
            {{- end }}
            {{- if .Values.proxy.enrichment.enabled }}
            - name: enrichment-data
              mountPath: /app/shared/enrichment
            - name: enrichment-model-verified
              mountPath: /app/verified-enrichment
              readOnly: true
            {{- end }}
            - name: telemetry-data
              mountPath: /app/data
            - name: siem-stats
              mountPath: /app/shared/siem
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ ternary "/ready/attachments" "/health" .Values.proxy.attachments.service.enabled }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        {{- if and .Values.proxy.attachments.service.enabled (eq .Values.proxy.attachments.service.storage "local-sqlite") }}
        - name: attachment-data
          persistentVolumeClaim:
            claimName: {{ .Values.proxy.attachments.service.local.existingClaim | default "proxy-attachments" | quote }}
        - name: attachment-config
          configMap:
            name: attachment-storage-config
        {{- end }}
        {{- if eq .Values.telemetry.outbox.mode "shared-postgresql" }}
        - name: outbox-pg-secret
          secret:
            secretName: {{ .Values.telemetry.outbox.postgresql.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.telemetry.outbox.postgresql.urlKey | quote }}
                path: postgresql-url
              {{- if .Values.telemetry.outbox.postgresql.caKey }}
              - key: {{ .Values.telemetry.outbox.postgresql.caKey | quote }}
                path: ca.crt
              {{- end }}
        - name: outbox-pg-config
          emptyDir:
            medium: Memory
            sizeLimit: 2Mi
        {{- end }}
        - name: secrets
          secret:
            secretName: bulwark-proxy-secrets
        {{- if and (not .Values.redis.enabled) .Values.externalRedis.existingSecret }}
        - name: redis-external-secret
          secret:
            secretName: {{ .Values.externalRedis.existingSecret }}
        {{- end }}
        - name: policies
          persistentVolumeClaim:
            claimName: policies
        - name: notifications-data
          persistentVolumeClaim:
            claimName: notifications-data
        - name: admin-data
          persistentVolumeClaim:
            claimName: admin-data
        {{- if .Values.proxy.ml.enabled }}
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models
        {{- end }}
        {{- if .Values.proxy.enrichment.enabled }}
        - name: enrichment-model-source
          persistentVolumeClaim:
            claimName: {{ .Values.proxy.enrichment.existingModelClaim | quote }}
            readOnly: true
        - name: enrichment-model-verified
          emptyDir:
            sizeLimit: {{ .Values.proxy.enrichment.modelMaxBytes | int64 | quote }}
        - name: enrichment-data
          persistentVolumeClaim:
            claimName: enrichment-data
        {{- end }}
        - name: telemetry-data
          {{- if eq .Values.telemetry.outbox.mode "local-durable" }}
          persistentVolumeClaim:
            claimName: {{ .Values.telemetry.outbox.local.existingClaim | default "proxy-outbox" | quote }}
          {{- else }}
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
          {{- end }}
        - name: siem-stats
          persistentVolumeClaim:
            claimName: siem-stats
        - name: tmp
          emptyDir:
            medium: Memory
            {{- if or .Values.proxy.attachments.extractDocuments .Values.proxy.attachments.parserIsolationConfirmed }}
            sizeLimit: {{ max (ternary 500 50 .Values.proxy.enrichment.enabled) (int (trimSuffix "Mi" .Values.proxy.attachments.extractionTmpSize)) }}Mi
            {{- else if .Values.proxy.enrichment.enabled }}
            sizeLimit: 500Mi
            {{- else }}
            sizeLimit: 50Mi
            {{- end }}
---
# Proxy Service
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 4 }}
{{- if .Values.proxy.autoscaling.enabled }}
---
# Proxy HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proxy
  minReplicas: {{ .Values.proxy.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.proxy.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.proxy.autoscaling.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.proxy.autoscaling.targetMemoryUtilization }}
{{- end }}
{{- if .Values.proxy.pdb.enabled }}
---
# Proxy PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: proxy-pdb
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.proxy.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 6 }}
{{- end }}
