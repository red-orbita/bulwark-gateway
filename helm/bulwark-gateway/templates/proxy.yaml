---
# Proxy ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bulwark-proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Proxy Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: bulwark-gateway
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/health/metrics"
        checksum/config: "{{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 8 }}"
        checksum/secrets: "{{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum | trunc 8 }}"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: bulwark-proxy
      automountServiceAccountToken: false
      # DNS: lower ndots so fully-qualified in-cluster names (backend/redis
      # "*.svc.cluster.local", 4 dots) resolve as absolute on the first query
      # instead of being treated as relative under the default ndots:5 (which
      # appends every search domain first and can add multi-second per-connection
      # latency on clusters with slow/leaked search domains).
      dnsConfig:
        options:
          - name: ndots
            value: "{{ .Values.proxy.dnsNdots | default "2" }}"
      {{- if .Values.proxy.scheduling.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.proxy.scheduling.podAntiAffinity.type "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 20 }}
                topologyKey: topology.kubernetes.io/zone
          {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- end }}
      {{- if .Values.proxy.scheduling.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.proxy.scheduling.topologySpreadConstraints.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.proxy.scheduling.topologySpreadConstraints.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 14 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # Distroless nonroot UID/GID. On upgrade from the pre-distroless image
        # (UID 999), fsGroup + fsGroupChangePolicy: Always re-chowns existing
        # PVCs to GID 65532 on mount so the proxy can write shared/enrichment data.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: Always
        seccompProfile:
          {{- if .Values.proxy.seccomp.localhost }}
          type: Localhost
          localhostProfile: {{ .Values.proxy.seccomp.localhostProfile }}
          {{- else }}
          type: RuntimeDefault
          {{- end }}
      initContainers:
        - name: init-policies
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          # Distroless has no shell/coreutils; use the bundled Python to seed
          # policies into the PVC (no-clobber, mirrors `cp -rn`).
          command:
            - python3
            - -c
            - |
              import shutil, pathlib
              src = pathlib.Path("/app/config/policies")
              dst = pathlib.Path("/policies")
              if src.is_dir():
                  for p in src.rglob("*"):
                      target = dst / p.relative_to(src)
                      if p.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      elif not target.exists():
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(p, target)
              print("policies seeded")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policies
              mountPath: /policies
        {{- if .Values.proxy.ml.enabled }}
        - name: init-models
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          # Distroless has no shell/sha256sum; use the bundled Python (hashlib)
          # for presence checks and SHA-256 integrity verification.
          command:
            - python3
            - -c
            - |
              import hashlib, sys
              from pathlib import Path

              print("Checking ML models...")
              models = "{{ join " " .Values.proxy.ml.models }}".split()
              for model in models:
                  base = Path("/models") / model
                  if (base / "model.onnx").is_file():
                      print(f"  Model '{model}' already present")
                  elif (base / "model.safetensors").is_file():
                      print(f"  Model '{model}' already present (safetensors)")
                  else:
                      print(f"  Model '{model}' not found - will run without it (graceful degradation)")

              def verify(name, path, expected):
                  f = Path(path)
                  if not f.is_file():
                      return
                  h = hashlib.sha256()
                  with open(f, "rb") as fh:
                      for chunk in iter(lambda: fh.read(1048576), b""):
                          h.update(chunk)
                  actual = h.hexdigest()
                  if actual != expected:
                      print(f"FATAL: {name} checksum mismatch! Expected={expected} Got={actual}")
                      sys.exit(1)
                  print(f"  Integrity verified: {name} ({actual})")

              {{- if .Values.proxy.mlModels.checksums.injection_classifier }}
              verify("injection-classifier", "/models/injection-classifier/model.safetensors", "{{ .Values.proxy.mlModels.checksums.injection_classifier }}")
              {{- end }}
              {{- if .Values.proxy.mlModels.checksums.toxicity }}
              verify("toxicity", "/models/toxicity/model.safetensors", "{{ .Values.proxy.mlModels.checksums.toxicity }}")
              {{- end }}
              print("Model check complete")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ml-models
              mountPath: /models
        {{- end }}
        {{- if .Values.proxy.enrichment.enabled }}
        - name: init-enrichment-model
          image: {{ .Values.proxy.enrichment.initImage | default "python:3.12-slim" }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import os, sys, json, urllib.request, urllib.error
              from pathlib import Path

              MODEL_NAME = os.getenv("BULWARK_EMBED_MODEL", "{{ .Values.proxy.enrichment.model }}")
              TARGET_DIR = Path("{{ .Values.proxy.enrichment.modelCachePath }}")
              HF_BASE = "https://huggingface.co"

              REQUIRED_FILES = [
                  "config.json", "tokenizer.json", "tokenizer_config.json",
                  "special_tokens_map.json", "vocab.txt", "modules.json",
                  "sentence_bert_config.json",
              ]
              MODEL_FILES = ["model.safetensors", "pytorch_model.bin"]
              POOLING_FILES = ["1_Pooling/config.json"]

              model_dir = TARGET_DIR / f"sentence-transformers_{MODEL_NAME}"

              # Check if already downloaded
              if model_dir.exists() and (model_dir / "config.json").exists():
                  has_weights = any((model_dir / f).exists() for f in MODEL_FILES)
                  if has_weights:
                      print(f"Model already exists at {model_dir}, skipping download")
                      sys.exit(0)

              print(f"Downloading sentence-transformers/{MODEL_NAME} to {model_dir}...")
              model_dir.mkdir(parents=True, exist_ok=True)

              files = REQUIRED_FILES + ["model.safetensors"] + POOLING_FILES
              ok, fail = 0, 0
              for filename in files:
                  dest = model_dir / filename
                  if dest.exists():
                      ok += 1
                      continue
                  url = f"{HF_BASE}/sentence-transformers/{MODEL_NAME}/resolve/main/{filename}"
                  try:
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      req = urllib.request.Request(url, headers={"User-Agent": "bulwark-init/1.0"})
                      with urllib.request.urlopen(req, timeout=120) as resp:
                          with open(dest, "wb") as f:
                              while chunk := resp.read(1048576):
                                  f.write(chunk)
                      print(f"  OK: {filename} ({dest.stat().st_size // 1024}KB)")
                      ok += 1
                  except Exception as e:
                      print(f"  SKIP: {filename} ({e})")
                      fail += 1

              print(f"Download complete: {ok} OK, {fail} skipped")
              # Non-fatal: proxy starts with graceful degradation if model missing
              sys.exit(0)
          env:
            - name: BULWARK_EMBED_MODEL
              value: "{{ .Values.proxy.enrichment.model }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 256Mi
              cpu: 500m
            requests:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: enrichment-data
              mountPath: /app/shared/enrichment
            - name: tmp
              mountPath: /tmp
        {{- end }}
      containers:
        - name: proxy
          image: {{ include "bulwark-gateway.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: proxy-config
          resources:
            {{- if .Values.proxy.ml.enabled }}
            {{- toYaml .Values.proxy.ml.resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.proxy.resources | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              {{- if .Values.proxy.seccomp.localhost }}
              type: Localhost
              localhostProfile: {{ .Values.proxy.seccomp.localhostProfile }}
              {{- else }}
              type: RuntimeDefault
              {{- end }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.existingSecret }}
            - name: redis-external-secret
              mountPath: /run/secrets/redis-password
              subPath: {{ include "bulwark-gateway.redis.secretKey" . }}
              readOnly: true
            {{- end }}
            - name: policies
              mountPath: /app/config/policies
              readOnly: true
            - name: notifications-data
              mountPath: /app/shared/notifications
              readOnly: true
            - name: admin-data
              mountPath: /app/shared/admin
              readOnly: true
            {{- if .Values.proxy.ml.enabled }}
            - name: ml-models
              mountPath: {{ .Values.proxy.ml.modelDir }}
              readOnly: true
            {{- end }}
            {{- if .Values.proxy.enrichment.enabled }}
            - name: enrichment-data
              mountPath: /app/shared/enrichment
            {{- end }}
            - name: telemetry-data
              mountPath: /app/data
            - name: siem-stats
              mountPath: /app/shared/siem
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - name: secrets
          secret:
            secretName: bulwark-proxy-secrets
        {{- if and (not .Values.redis.enabled) .Values.externalRedis.existingSecret }}
        - name: redis-external-secret
          secret:
            secretName: {{ .Values.externalRedis.existingSecret }}
        {{- end }}
        - name: policies
          persistentVolumeClaim:
            claimName: policies
        - name: notifications-data
          persistentVolumeClaim:
            claimName: notifications-data
        - name: admin-data
          persistentVolumeClaim:
            claimName: admin-data
        {{- if .Values.proxy.ml.enabled }}
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models
        {{- end }}
        {{- if .Values.proxy.enrichment.enabled }}
        - name: enrichment-data
          persistentVolumeClaim:
            claimName: enrichment-data
        {{- end }}
        - name: telemetry-data
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
        - name: siem-stats
          persistentVolumeClaim:
            claimName: siem-stats
        - name: tmp
          emptyDir:
            medium: Memory
            {{- if .Values.proxy.enrichment.enabled }}
            sizeLimit: 500Mi
            {{- else }}
            sizeLimit: 50Mi
            {{- end }}
---
# Proxy Service
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 4 }}
{{- if .Values.proxy.autoscaling.enabled }}
---
# Proxy HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proxy
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proxy
  minReplicas: {{ .Values.proxy.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.proxy.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.proxy.autoscaling.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.proxy.autoscaling.targetMemoryUtilization }}
{{- end }}
{{- if .Values.proxy.pdb.enabled }}
---
# Proxy PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: proxy-pdb
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.proxy.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "bulwark-gateway.proxy.selectorLabels" . | nindent 6 }}
{{- end }}
