{{- if or .Values.proxy.seccomp.localhost .Values.proxy.pluginSeccomp.localhost }}
---
# Seccomp-BPF Profile Installer DaemonSet
# Deploys custom seccomp profiles to every node's kubelet seccomp directory.
# Profiles enforce syscall-level restrictions beyond what RuntimeDefault provides.
#
# Three profiles:
#   - bulwark-proxy.json: Blocks execve, ptrace, mount, privilege escalation
#   - bulwark-admin.json: Similar to proxy but allows execve (for healthchecks)
#   - bulwark-plugin-sandbox.json: ULTRA-RESTRICTIVE — blocks ALL network + exec + writes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seccomp-installer
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: seccomp-installer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seccomp-installer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seccomp-installer
        app.kubernetes.io/part-of: bulwark-gateway
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Runs once and sleeps — restart on profile ConfigMap change via checksum annotation
      initContainers:
        - name: install-profiles
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /host-seccomp/profiles
              cp /profiles/bulwark-proxy.json /host-seccomp/profiles/bulwark-proxy.json
              cp /profiles/bulwark-admin.json /host-seccomp/profiles/bulwark-admin.json
              cp /profiles/bulwark-plugin-sandbox.json /host-seccomp/profiles/bulwark-plugin-sandbox.json
              echo "Seccomp profiles installed to /var/lib/kubelet/seccomp/profiles/"
              ls -la /host-seccomp/profiles/
          volumeMounts:
            - name: seccomp-profiles
              mountPath: /profiles
              readOnly: true
            - name: host-seccomp
              mountPath: /host-seccomp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: sleep
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            limits:
              memory: 8Mi
              cpu: 10m
            requests:
              memory: 4Mi
              cpu: 1m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: seccomp-profiles
          configMap:
            name: seccomp-profiles
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
      tolerations:
        - effect: NoSchedule
          operator: Exists
      priorityClassName: system-node-critical
---
# ConfigMap with the seccomp profile JSON content
apiVersion: v1
kind: ConfigMap
metadata:
  name: seccomp-profiles
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: security
data:
  bulwark-proxy.json: |
    {
      "defaultAction": "SCMP_ACT_ERRNO",
      "defaultErrnoRet": 1,
      "archMap": [
        {"architecture": "SCMP_ARCH_X86_64", "subArchitectures": ["SCMP_ARCH_X86", "SCMP_ARCH_X32"]},
        {"architecture": "SCMP_ARCH_AARCH64", "subArchitectures": []}
      ],
      "syscalls": [
        {
          "names": [
            "accept","accept4","access","arch_prctl","bind","brk","capget","capset",
            "clock_getres","clock_gettime","clock_nanosleep","clone","clone3",
            "close","close_range","connect","copy_file_range","dup","dup2","dup3",
            "epoll_create","epoll_create1","epoll_ctl","epoll_wait","epoll_pwait","epoll_pwait2",
            "eventfd","eventfd2","exit","exit_group","faccessat","faccessat2","fadvise64",
            "fallocate","fchmod","fchmodat","fchown","fchownat","fcntl","fdatasync","flock",
            "fstat","fstatat64","fstatfs","fsync","ftruncate","futex","futex_waitv",
            "get_robust_list","getcwd","getdents","getdents64","getegid","geteuid","getgid",
            "getgroups","getpeername","getpgid","getpgrp","getpid","getppid","getrandom",
            "getresgid","getresuid","getrlimit","getsockname","getsockopt","gettid",
            "gettimeofday","getuid","ioctl","kill","lchown","link","linkat","listen","lseek",
            "lstat","madvise","membarrier","memfd_create","mincore","mkdir","mkdirat",
            "mlock","mlock2","mmap","mmap2","mprotect","mremap","msync","munlock","munmap",
            "nanosleep","newfstatat","open","openat","openat2","pause","pipe","pipe2",
            "poll","ppoll","prctl","pread64","preadv","preadv2","prlimit64","pselect6",
            "pwrite64","pwritev","pwritev2","read","readahead","readlink","readlinkat","readv",
            "recvfrom","recvmmsg","recvmsg","rename","renameat","renameat2","restart_syscall",
            "rmdir","rseq","rt_sigaction","rt_sigpending","rt_sigprocmask","rt_sigreturn",
            "rt_sigtimedwait","sched_getaffinity","sched_getattr","sched_getparam",
            "sched_getscheduler","sched_yield","select","sendfile","sendmmsg","sendmsg",
            "sendto","set_robust_list","set_tid_address","setitimer","setsockopt","shutdown",
            "sigaltstack","socket","socketpair","splice","stat","statfs","statx",
            "symlink","symlinkat","sysinfo","tgkill","time","timer_create","timer_delete",
            "timer_getoverrun","timer_gettime","timer_settime","timerfd_create",
            "timerfd_gettime","timerfd_settime","tkill","truncate","umask","uname",
            "unlink","unlinkat","utime","utimensat","utimes","wait4","waitid","write","writev"
          ],
          "action": "SCMP_ACT_ALLOW"
        },
        {"names": ["execve","execveat"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["ptrace","process_vm_readv","process_vm_writev"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["mount","umount","umount2","pivot_root"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["init_module","finit_module","delete_module","create_module"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["setuid","setgid","setreuid","setregid","setresuid","setresgid","setfsuid","setfsgid","setgroups","setpgid","setsid"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["acct","add_key","bpf","clock_adjtime","clock_settime","kexec_file_load","kexec_load","keyctl","lookup_dcookie","nfsservctl","open_by_handle_at","perf_event_open","personality","quotactl","reboot","request_key","setdomainname","sethostname","setns","settimeofday","swapon","swapoff","syslog","unshare","userfaultfd","vm86","vm86old","vmsplice","ioperm","iopl"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1}
      ]
    }
  bulwark-admin.json: |
    {
      "defaultAction": "SCMP_ACT_ERRNO",
      "defaultErrnoRet": 1,
      "archMap": [
        {"architecture": "SCMP_ARCH_X86_64", "subArchitectures": ["SCMP_ARCH_X86", "SCMP_ARCH_X32"]},
        {"architecture": "SCMP_ARCH_AARCH64", "subArchitectures": []}
      ],
      "syscalls": [
        {
          "names": [
            "accept","accept4","access","arch_prctl","bind","brk","capget","capset",
            "clock_getres","clock_gettime","clock_nanosleep","clone","clone3",
            "close","close_range","connect","copy_file_range","dup","dup2","dup3",
            "epoll_create","epoll_create1","epoll_ctl","epoll_wait","epoll_pwait","epoll_pwait2",
            "eventfd","eventfd2","execve","execveat","exit","exit_group",
            "faccessat","faccessat2","fadvise64","fallocate","fchmod","fchmodat",
            "fchown","fchownat","fcntl","fdatasync","flock","fstat","fstatat64","fstatfs",
            "fsync","ftruncate","futex","futex_waitv","get_robust_list","getcwd",
            "getdents","getdents64","getegid","geteuid","getgid","getgroups","getpeername",
            "getpgid","getpgrp","getpid","getppid","getrandom","getresgid","getresuid",
            "getrlimit","getsockname","getsockopt","gettid","gettimeofday","getuid","ioctl",
            "kill","lchown","link","linkat","listen","lseek","lstat","madvise","membarrier",
            "memfd_create","mincore","mkdir","mkdirat","mlock","mlock2","mmap","mmap2",
            "mprotect","mremap","msync","munlock","munmap","nanosleep","newfstatat",
            "open","openat","openat2","pause","pipe","pipe2","poll","ppoll","prctl",
            "pread64","preadv","preadv2","prlimit64","pselect6","pwrite64","pwritev",
            "pwritev2","read","readahead","readlink","readlinkat","readv","recvfrom",
            "recvmmsg","recvmsg","rename","renameat","renameat2","restart_syscall","rmdir",
            "rseq","rt_sigaction","rt_sigpending","rt_sigprocmask","rt_sigreturn",
            "rt_sigtimedwait","sched_getaffinity","sched_getattr","sched_getparam",
            "sched_getscheduler","sched_yield","select","sendfile","sendmmsg","sendmsg",
            "sendto","set_robust_list","set_tid_address","setitimer","setsockopt","shutdown",
            "sigaltstack","socket","socketpair","splice","stat","statfs","statx",
            "symlink","symlinkat","sysinfo","tgkill","time","timer_create","timer_delete",
            "timer_getoverrun","timer_gettime","timer_settime","timerfd_create",
            "timerfd_gettime","timerfd_settime","tkill","truncate","umask","uname",
            "unlink","unlinkat","utime","utimensat","utimes","wait4","waitid","waitpid",
            "write","writev"
          ],
          "action": "SCMP_ACT_ALLOW"
        },
        {"names": ["ptrace","process_vm_readv","process_vm_writev"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["mount","umount","umount2","pivot_root"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["init_module","finit_module","delete_module","create_module"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["setuid","setgid","setreuid","setregid","setresuid","setresgid","setfsuid","setfsgid","setgroups","setpgid","setsid"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"names": ["acct","add_key","bpf","clock_adjtime","clock_settime","kexec_file_load","kexec_load","keyctl","lookup_dcookie","nfsservctl","open_by_handle_at","perf_event_open","personality","quotactl","reboot","request_key","setdomainname","sethostname","setns","settimeofday","swapon","swapoff","syslog","unshare","userfaultfd","vm86","vm86old","vmsplice","ioperm","iopl"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1}
      ]
    }
  bulwark-plugin-sandbox.json: |
    {
      "defaultAction": "SCMP_ACT_ERRNO",
      "defaultErrnoRet": 1,
      "archMap": [
        {"architecture": "SCMP_ARCH_X86_64", "subArchitectures": ["SCMP_ARCH_X86", "SCMP_ARCH_X32"]},
        {"architecture": "SCMP_ARCH_AARCH64", "subArchitectures": []}
      ],
      "syscalls": [
        {
          "_comment": "Core computation: memory, threading, file reads, time. NO NETWORK, NO EXEC.",
          "names": [
            "access","arch_prctl","brk","clock_getres","clock_gettime","clock_nanosleep",
            "clone","clone3","close","close_range","dup","dup2","dup3",
            "epoll_create","epoll_create1","epoll_ctl","epoll_wait","epoll_pwait",
            "eventfd","eventfd2","exit","exit_group","faccessat","faccessat2","fadvise64",
            "fallocate","fcntl","fdatasync","flock","fstat","fstatat64","fstatfs","fsync",
            "ftruncate","futex","futex_waitv","get_robust_list","getcwd","getdents",
            "getdents64","getegid","geteuid","getgid","getgroups","getpgid","getpgrp",
            "getpid","getppid","getrandom","getresgid","getresuid","getrlimit","gettid",
            "gettimeofday","getuid","ioctl","lseek","lstat","madvise","membarrier",
            "mincore","mkdir","mkdirat","mlock","mlock2","mmap","mmap2","mprotect",
            "mremap","msync","munlock","munmap","nanosleep","newfstatat","open","openat",
            "openat2","pause","pipe","pipe2","poll","ppoll","prctl","pread64","preadv",
            "prlimit64","pselect6","pwrite64","pwritev","read","readahead","readlink",
            "readlinkat","readv","rename","renameat","renameat2","restart_syscall","rmdir",
            "rseq","rt_sigaction","rt_sigpending","rt_sigprocmask","rt_sigreturn",
            "rt_sigtimedwait","sched_getaffinity","sched_getattr","sched_getparam",
            "sched_getscheduler","sched_yield","select","set_robust_list","set_tid_address",
            "setitimer","sigaltstack","stat","statfs","statx","sysinfo","tgkill","time",
            "timer_create","timer_delete","timer_getoverrun","timer_gettime","timer_settime",
            "timerfd_create","timerfd_gettime","timerfd_settime","tkill","truncate",
            "umask","uname","unlink","unlinkat","wait4","waitid","write","writev"
          ],
          "action": "SCMP_ACT_ALLOW"
        },
        {"_comment": "BLOCKED: ALL network", "names": ["socket","socketpair","connect","accept","accept4","bind","listen","sendto","sendmsg","sendmmsg","sendfile","recvfrom","recvmsg","recvmmsg","getsockname","getpeername","getsockopt","setsockopt","shutdown","splice"], "action": "SCMP_ACT_ERRNO", "errnoRet": 13},
        {"_comment": "BLOCKED: exec", "names": ["execve","execveat"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"_comment": "BLOCKED: debug", "names": ["ptrace","process_vm_readv","process_vm_writev"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"_comment": "BLOCKED: mount", "names": ["mount","umount","umount2","pivot_root","chroot"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"_comment": "BLOCKED: modules", "names": ["init_module","finit_module","delete_module","create_module"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"_comment": "BLOCKED: privesc", "names": ["setuid","setgid","setreuid","setregid","setresuid","setresgid","setfsuid","setfsgid","setgroups","setpgid","setsid","capset"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"_comment": "BLOCKED: ns escape", "names": ["setns","unshare","personality"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1},
        {"_comment": "BLOCKED: admin", "names": ["acct","add_key","bpf","clock_adjtime","clock_settime","kexec_file_load","kexec_load","keyctl","lookup_dcookie","nfsservctl","open_by_handle_at","perf_event_open","quotactl","reboot","request_key","setdomainname","sethostname","settimeofday","swapon","swapoff","syslog","userfaultfd","vm86","vm86old","vmsplice","ioperm","iopl","io_setup","io_destroy","io_submit","io_cancel","io_getevents","kill"], "action": "SCMP_ACT_ERRNO", "errnoRet": 1}
      ]
    }
{{- end }}
