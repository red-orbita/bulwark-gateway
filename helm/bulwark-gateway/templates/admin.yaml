---
# Admin ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bulwark-admin
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.admin.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Admin Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.admin.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "bulwark-gateway.admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bulwark-gateway.admin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: bulwark-gateway
        app.kubernetes.io/component: admin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/admin/health/metrics"
        checksum/config: "{{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 8 }}"
        checksum/secrets: "{{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum | trunc 8 }}"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: bulwark-admin
      automountServiceAccountToken: false
      # DNS: lower ndots so fully-qualified in-cluster service names (e.g. the
      # PostgreSQL DSN "*.svc.cluster.local", 4 dots) resolve as absolute on the
      # first query instead of being treated as relative under the default
      # ndots:5 — which appends every search domain first and can add multi-second
      # latency per new connection (observed ~6s per login on some clusters).
      dnsConfig:
        options:
          - name: ndots
            value: "{{ .Values.admin.dnsNdots | default "2" }}"
      securityContext:
        runAsNonRoot: true
        # Distroless nonroot UID/GID. On upgrade from the pre-distroless image
        # (UID 999), fsGroup + fsGroupChangePolicy: Always re-chowns existing
        # PVCs to GID 65532 on mount so the admin can write its SQLCipher DB.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      {{- if eq .Values.admin.database.type "postgresql" }}
      initContainers:
        - name: wait-postgresql
          image: "{{ .Values.admin.database.postgresql.image.repository }}:{{ .Values.admin.database.postgresql.image.tag }}"
          command: ["sh", "-c", "until pg_isready -h postgresql -p {{ .Values.admin.database.postgresql.port }} -U {{ .Values.admin.database.postgresql.username }}; do echo 'Waiting for PostgreSQL...'; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: admin
          image: {{ include "bulwark-gateway.admin.image" . }}
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-config
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            {{- if eq .Values.admin.database.type "postgresql" }}
            - name: postgresql-secret
              mountPath: /run/secrets-pg
              readOnly: true
            {{- end }}
            {{- if and (not .Values.redis.enabled) .Values.externalRedis.existingSecret }}
            - name: redis-external-secret
              mountPath: /run/secrets/redis-password
              subPath: {{ include "bulwark-gateway.redis.secretKey" . }}
              readOnly: true
            {{- end }}
            - name: policies
              mountPath: /app/config/policies
            - name: admin-data
              mountPath: /app/data
            - name: notifications-data
              mountPath: /app/shared/notifications
            - name: siem-stats
              mountPath: /app/shared/siem
            {{- if .Values.proxy.enrichment.enabled }}
            - name: enrichment-data
              mountPath: /app/shared/enrichment
              readOnly: true
            {{- end }}
            - name: reports
              mountPath: /app/reports
            - name: plugins
              mountPath: /app/plugins
            - name: tmp
              mountPath: /tmp
          # Startup probe: the admin lifespan does real blocking work on cold
          # start (PostgreSQL audit-chain restore + loading the full IOC DB, tens
          # of thousands of entries) before uvicorn accepts connections. Give it
          # up to 150s (30 x 5s) to finish before liveness/readiness take over,
          # so a legitimately slow first boot is not mistaken for a hang.
          startupProbe:
            httpGet:
              path: /admin/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: secrets
          secret:
            secretName: bulwark-admin-secrets
        {{- if eq .Values.admin.database.type "postgresql" }}
        - name: postgresql-secret
          secret:
            secretName: postgresql-credentials
        {{- end }}
        {{- if and (not .Values.redis.enabled) .Values.externalRedis.existingSecret }}
        - name: redis-external-secret
          secret:
            secretName: {{ .Values.externalRedis.existingSecret }}
        {{- end }}
        - name: policies
          persistentVolumeClaim:
            claimName: policies
        - name: admin-data
          persistentVolumeClaim:
            claimName: admin-data
        - name: notifications-data
          persistentVolumeClaim:
            claimName: notifications-data
        - name: siem-stats
          persistentVolumeClaim:
            claimName: siem-stats
        {{- if .Values.proxy.enrichment.enabled }}
        - name: enrichment-data
          persistentVolumeClaim:
            claimName: enrichment-data
        {{- end }}
        - name: reports
          persistentVolumeClaim:
            claimName: reports
        - name: plugins
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
---
# Admin Service
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: {{ include "bulwark-gateway.namespace" . }}
  labels:
    {{- include "bulwark-gateway.admin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bulwark-gateway.admin.selectorLabels" . | nindent 4 }}
