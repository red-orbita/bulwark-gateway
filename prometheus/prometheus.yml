# Bulwark Gateway - Prometheus Configuration
# Standalone deployment (docker-compose)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "rules.yml"
  - "recording-rules.yml"

scrape_configs:
  # NOTE: there is no "bulwark-proxy" scrape job by design. The proxy exposes no
  # Prometheus endpoint (no /health/metrics); all proxy request/verdict/
  # correlation metrics are written to Redis and surfaced via the admin
  # exposition below. Scraping the proxy directly would 404.
  #
  # NOTE: there is likewise no "bulwark-redis" job. This stack ships plain
  # redis:7-alpine with no redis_exporter sidecar, so redis:6379 speaks RESP —
  # not the Prometheus text format. Scraping it would only produce scrape errors.
  # Redis-derived counters reach Prometheus through the admin exposition, which
  # reads Redis and renders bulwark_* series server-side.
  - job_name: "bulwark-admin"
    static_configs:
      - targets: ["admin:8090"]
    metrics_path: "/admin/health/metrics"
    scrape_interval: 10s
    # /admin/health/metrics is gated by a dedicated least-privilege bearer
    # (verified with hmac.compare_digest). The token is mounted as a docker
    # secret; if the secret file is empty the endpoint falls back to admin:read
    # JWT auth and this scrape would 401 — populate secrets/metrics_scrape_token.txt.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_scrape_token
