# Kustomization — Bulwark Gateway Kubernetes Deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: no global `namespace:` transformer — this deployment spans TWO
# namespaces (bulwark-gateway + bulwark-siem for Wazuh). A global directive
# would rewrite BOTH Namespace object names to the same value and produce a
# kustomize ID conflict. Every namespaced resource declares its own explicit
# metadata.namespace instead.

resources:
  - namespace.yaml
  - base/volumes.yaml
  - base/configmaps.yaml
  - base/redis.yaml
  - base/external-backends.yaml
  - base/proxy.yaml
  - base/admin.yaml
  - base/network-policies.yaml
  - base/ingress.yaml
  - base/pdb.yaml
  - monitoring/prometheus-grafana.yaml
  # Wazuh deployed separately in bulwark-siem namespace (baseline PSS)
  - monitoring/namespace-siem.yaml
  - monitoring/wazuh.yaml

# Labels applied to all resources
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.0.0"

# Images — pin to semver tags (NEVER use 'latest' in production)
# For immutable deploys, use sha256 digests: newTag: sha256:abc123...
images:
  - name: bulwark-gateway-proxy
    newName: bulwark-gateway-proxy
    newTag: "1.0.0"
  - name: bulwark-gateway-admin
    newName: bulwark-gateway-admin
    newTag: "1.0.0"
