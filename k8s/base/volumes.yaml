  labels:
    app.kubernetes.io/part-of: bulwark-gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: admin-data
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/part-of: bulwark-gateway
spec:
  accessModes:
    - ReadWriteOnce
