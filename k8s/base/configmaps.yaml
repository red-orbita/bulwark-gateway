---
# ConfigMaps for non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: bulwark-gateway
data:
  # BULWARK_BACKEND_URL: omitted — agents.yaml default uses k8s Service DNS (ollama:11434)
  # Override per-agent in agents.yaml for multi-cloud backends
  BULWARK_AGENTS_FILE: "/app/shared/admin/agents.yaml"
  BULWARK_IOC_PATH: "/app/shared/admin/iocs.json"
  BULWARK_FAIL_MODE: "closed"
  BULWARK_LOG_FORMAT: "json"
  BULWARK_LOG_LEVEL: "INFO"
  BULWARK_RATE_LIMIT_RPM: "60"
  BULWARK_WORKERS: "1"
  BULWARK_TELEMETRY_ENABLED: "true"
  BULWARK_TELEMETRY_BATCH_SIZE: "100"
  BULWARK_TELEMETRY_FLUSH_INTERVAL: "1.0"
  BULWARK_SIEM_STATS_FILE: "/app/shared/siem/siem_stats.json"
  BULWARK_SIEM_TRANSPORTS_FILE: "/app/shared/siem/siem_transports.json"
  # SECURITY NOTE (VULN 2.9): Internal Redis uses plaintext by default.
  # This is acceptable when:
  #   1. NetworkPolicies restrict Redis access to proxy+admin pods ONLY (enforced)
  #   2. No untrusted workloads share the namespace
  # For higher security (e.g., shared cluster), switch to rediss:// with TLS:
  #   BULWARK_REDIS_URL: "rediss://redis.bulwark-gateway.svc.cluster.local:6379/0"
  #   BULWARK_REDIS_TLS_INSECURE: "true"  (if using self-signed cert on internal Redis)
  BULWARK_REDIS_URL: "redis://redis.bulwark-gateway.svc.cluster.local:6379/0"
  # File paths for secrets mounted as volumes
  BULWARK_JWT_SECRET_FILE: "/run/secrets/jwt-secret"
  BULWARK_REDIS_PASSWORD_FILE: "/run/secrets/redis-password"
  BULWARK_API_KEYS_FILE: "/run/secrets/api-keys"
  BULWARK_URLHAUS_KEY_FILE: "/run/secrets/urlhaus-key"
  BULWARK_THREATFOX_KEY_FILE: "/run/secrets/threatfox-key"
  BULWARK_OTX_KEY_FILE: "/run/secrets/otx-key"
  BULWARK_ABUSEIPDB_KEY_FILE: "/run/secrets/abuseipdb-key"
  BULWARK_NOTIFICATIONS_FILE: "/app/shared/notifications/channels.json"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: bulwark-gateway
data:
  ADMIN_JWT_EXPIRY_HOURS: "8"
  ADMIN_CORS_ORIGINS: ""
  BULWARK_TELEMETRY_ENABLED: "true"
  BULWARK_REDIS_URL: "redis://redis.bulwark-gateway.svc.cluster.local:6379/0"
  # External Redis: same URL as proxy-config (see above for examples)
  # File paths for secrets mounted as volumes
  BULWARK_REDIS_PASSWORD_FILE: "/run/secrets/redis-password"
  ADMIN_JWT_SECRET_FILE: "/run/secrets/admin-jwt-secret"
  ADMIN_PASSWORD_FILE: "/run/secrets/admin-password"
  SECURITY_PASSWORD_FILE: "/run/secrets/security-password"
  AUDITOR_PASSWORD_FILE: "/run/secrets/auditor-password"
  DB_ENCRYPTION_KEY_FILE: "/run/secrets/db-encryption-key"
  BULWARK_PROXY_API_KEY_FILE: "/run/secrets/api-keys"
  BULWARK_NOTIFICATIONS_FILE: "/app/shared/notifications/channels.json"
  # SkillSpector — pre-deployment skill security scanning
  BULWARK_SKILLSPECTOR_ENABLED: "true"
  BULWARK_SKILLSPECTOR_BLOCK_THRESHOLD: "7.0"
  BULWARK_SKILLSPECTOR_WARN_THRESHOLD: "4.0"
  BULWARK_SKILLSPECTOR_TIMEOUT: "60"
  BULWARK_SKILLSPECTOR_CACHE_TTL: "300"
---
# Static config files (iocs, agents, siem)
apiVersion: v1
kind: ConfigMap
metadata:
  name: bulwark-static-config
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/part-of: bulwark-gateway
data: {}
# NOTE: For large config files (iocs.json, agents.yaml), use:
#   kubectl create configmap bulwark-static-config \
#     --from-file=iocs.json=config/iocs.json \
#     --from-file=agents.yaml=config/agents.yaml \
#     -n bulwark-gateway --dry-run=client -o yaml | kubectl apply -f -
