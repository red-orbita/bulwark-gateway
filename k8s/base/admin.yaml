---
# Bulwark Gateway Admin — Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: bulwark-gateway
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: bulwark-gateway
        app.kubernetes.io/component: admin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/admin/health/metrics"
    spec:
      serviceAccountName: bulwark-admin
      automountServiceAccountToken: false
      # Resolve FQDN service DSNs (*.svc.cluster.local) as absolute on the first
      # query; avoids ~6s search-domain expansion per login under default ndots:5.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        runAsNonRoot: true
        # Distroless nonroot UID/GID. On upgrade from the pre-distroless image
        # (UID 999), fsGroup + fsGroupChangePolicy: Always re-chowns existing
        # PVCs to GID 65532 on mount so the admin can write its SQLCipher DB.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          # SECURITY FIX (VULN 2.12): Pin to explicit version, never use :latest.
          # NOTE: kustomization.yaml's images: transformer overrides this tag to
          # the release version (1.0.0) on `kubectl apply -k`; kept in sync here
          # so a direct `kubectl apply -f base/admin.yaml` also uses 1.0.0.
          image: bulwark-gateway-admin:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-config
          resources:
            limits:
              memory: 768Mi
              # bcrypt (cost 12) login verify is single-threaded CPU-bound
              # (~250ms/core). Sub-core caps cause throttling → multi-second
              # logins. Allow 2 cores for burst + concurrent logins.
              cpu: "2"
            requests:
              memory: 384Mi
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: policies
              mountPath: /app/config/policies
            - name: admin-data
              mountPath: /app/data
            - name: notifications-data
              mountPath: /app/shared/notifications
            - name: siem-stats
              mountPath: /app/shared/siem
            - name: reports
              mountPath: /app/reports
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: secrets
          secret:
            secretName: bulwark-admin-secrets
        - name: policies
          persistentVolumeClaim:
            claimName: policies
        - name: admin-data
          persistentVolumeClaim:
            claimName: admin-data
        - name: notifications-data
          persistentVolumeClaim:
            claimName: notifications-data
        - name: siem-stats
          persistentVolumeClaim:
            claimName: siem-stats
        - name: reports
          persistentVolumeClaim:
            claimName: reports
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
---
# Admin Service
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: bulwark-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: admin
---
# Admin ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bulwark-admin
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: bulwark-gateway
automountServiceAccountToken: false
