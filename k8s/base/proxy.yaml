---
# Bulwark Gateway Proxy — Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: bulwark-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxy
        app.kubernetes.io/part-of: bulwark-gateway
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/health/metrics"
    spec:
      serviceAccountName: bulwark-proxy
      automountServiceAccountToken: false
      # Resolve FQDN service names (backend/redis *.svc.cluster.local) as absolute
      # on the first query; avoids search-domain expansion under default ndots:5.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        runAsNonRoot: true
        # Distroless nonroot UID/GID. On upgrade from the pre-distroless image
        # (UID 999), fsGroup + fsGroupChangePolicy: Always re-chowns existing
        # PVCs to GID 65532 on mount so the proxy can write shared/enrichment data.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-policies
          # SECURITY FIX (VULN 2.12): Pin to explicit version, never use :latest
          image: bulwark-gateway-proxy:0.4.9-hardened
          imagePullPolicy: IfNotPresent
          # Distroless has no shell/coreutils; seed policies via bundled Python.
          command:
            - python3
            - -c
            - |
              import shutil, pathlib
              src = pathlib.Path("/app/config/policies")
              dst = pathlib.Path("/policies")
              if src.is_dir():
                  for p in src.rglob("*"):
                      target = dst / p.relative_to(src)
                      if p.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      elif not target.exists():
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(p, target)
              print("policies seeded")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policies
              mountPath: /policies
      containers:
        - name: proxy
          # SECURITY FIX (VULN 2.12): Pin to explicit version, never use :latest
          image: bulwark-gateway-proxy:0.4.9-hardened
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: proxy-config
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 128Mi
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: policies
              mountPath: /app/config/policies
              readOnly: true  # C-03: Proxy must NOT write policies
            - name: notifications-data
              mountPath: /app/shared/notifications
              readOnly: true  # Proxy reads channels, admin writes them
            - name: admin-data
              mountPath: /app/shared/admin
              readOnly: true  # Proxy reads agents.yaml, admin writes it
            - name: telemetry-data
              mountPath: /app/data
            - name: siem-stats
              mountPath: /app/shared/siem
              # Proxy writes: siem_stats.json + events.ndjson
              # Proxy reads: siem_transports.json (admin-managed)
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Cold start with --workers 4 (regex engine + scanners + enrichment)
            # measures ~32-40s. Old budget (5 + 6*5 = 35s) raced the app and caused
            # CrashLoopBackOff on cold nodes. 5 + 40*5 = 205s gives ample headroom;
            # liveness/readiness only engage once this succeeds.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 40
      volumes:
        - name: secrets
          secret:
            secretName: bulwark-proxy-secrets
        - name: policies
          persistentVolumeClaim:
            claimName: policies
        - name: notifications-data
          persistentVolumeClaim:
            claimName: notifications-data
        - name: admin-data
          persistentVolumeClaim:
            claimName: admin-data
        - name: telemetry-data
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi  # M-04: Volatile fallback — no persistent SQLite on disk
        - name: siem-stats
          persistentVolumeClaim:
            claimName: siem-stats
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
---
# Proxy Service
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: bulwark-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: proxy
---
# Proxy HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proxy
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: bulwark-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# Proxy ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bulwark-proxy
  namespace: bulwark-gateway
  labels:
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: bulwark-gateway
automountServiceAccountToken: false
