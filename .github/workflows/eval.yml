# Bulwark Gateway — Guardrail Evaluation (Red-Team Regression Gate)
#
# Runs the built-in adversarial evaluation harness against the always-on
# deterministic scanner pipeline (regex input guardrail + output redaction +
# tool policy) and fails the build if detection regresses or false positives
# spike. This is a security regression gate: pattern edits that quietly stop
# catching known attack classes are caught here before merge.
#
# The harness runs fully in-process — no gateway server, no network, no LLM
# backend, no models. It is deterministic (seeded), so the pass/fail is stable.
#
# Thresholds (absolute floors, deliberately below the current deterministic
# score so legitimate pattern tuning has headroom but real regressions fail):
#   detection rate >= 90%   (current standard-set score: 93%)
#   false-positive rate <= 2%   (current: 0%)

name: Guardrail Evaluation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Required at import time by src.config startup validation (32+ chars).
  BULWARK_JWT_SECRET: "ci-evaluation-secret-not-a-real-key-000000"

jobs:
  evaluate:
    name: "Red-Team Evaluation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install proxy dependencies (pinned)
        run: pip install -r requirements.lock

      - name: Run evaluation (standard attack set, regression gate)
        run: |
          python -m src.evaluation.cli run \
            --attacks standard \
            --min-detection-rate 0.90 \
            --max-fp-rate 0.02 \
            --report json \
            --output evaluation-report.json
          echo "## Guardrail Evaluation" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import json
          d = json.load(open('evaluation-report.json'))
          print(f\"- Detection rate: {d['detection_rate']:.1%}\")
          print(f\"- False-positive rate: {d['false_positive_rate']:.1%}\")
          print(f\"- Bypass rate: {d['bypass_rate']:.1%}\")
          print(f\"- Total attacks: {d['total_attacks']}\")
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Human-readable report (logs)
        if: always()
        run: |
          python -m src.evaluation.cli run \
            --attacks standard \
            --report text || true

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-report
          path: evaluation-report.json
          retention-days: 90

  corpus-benchmark:
    name: "External Corpus Benchmark"
    runs-on: ubuntu-latest
    # Independent, externally-labeled ground truth (AdvBench / HarmBench /
    # in-the-wild jailbreaks + benign). Unlike the self-generated red-team gate
    # above, the labels were NOT authored by Bulwark, so precision/recall/F1 are
    # defensible. Produces the shareable benchmark artifact and gates on the
    # "block" (enforced) decision policy. Floors are absolute — deliberately
    # below the current bundled-floor score (block recall ~0.13, FPR ~0.19) so
    # legitimate pattern tuning has headroom but a real collapse (recall→0 or a
    # runaway FPR) fails the build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install proxy dependencies (pinned)
        run: pip install -r requirements.lock

      - name: Run external corpus benchmark (regression gate)
        run: |
          python -m src.evaluation.cli corpus \
            --bundled-only \
            --policy block \
            --min-recall 0.10 \
            --max-fpr 0.25 \
            --report json \
            --output corpus-benchmark.json
          echo "## External Corpus Benchmark (independent ground truth)" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import json
          d = json.load(open('corpus-benchmark.json'))
          cb = d['confusion_block']; cs = d['corpus_stats']
          print(f\"- Corpus: {cs['total']} samples ({cs['malicious']} malicious / {cs['benign']} benign)\")
          print(f\"- Block precision/recall/F1: {cb['precision']:.3f} / {cb['recall']:.3f} / {cb['f1']:.3f}\")
          print(f\"- Block FPR: {cb['fpr']:.3f}\")
          print(f\"- Attack Success Rate: {d['attack_success_rate']:.1%}\")
          print(f\"- Latency P95: {d['latency_p95']:.1f} ms\")
          print('')
          print('| Source | N | Block Recall |')
          print('|--------|---|--------------|')
          for r in d['per_source']:
              print(f\"| {r['source']} | {r['total']} | {r['recall_block']:.3f} |\")
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Human-readable report (logs)
        if: always()
        run: |
          python -m src.evaluation.cli corpus \
            --bundled-only --report text || true

      - name: Upload corpus benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-benchmark
          path: corpus-benchmark.json
          retention-days: 90
