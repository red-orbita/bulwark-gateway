# Bulwark Gateway — CI/CD Pipeline (GitHub Actions)
#
# Triggers:
#   - Push to main → build, test, deploy to staging
#   - Tag v*.*.* → build, test, deploy to production
#   - Pull request → build and test only
#
# Required secrets:
#   REGISTRY_URL        — Container registry (e.g., ghcr.io/myorg)
#   REGISTRY_USERNAME   — Registry auth username
#   REGISTRY_PASSWORD   — Registry auth password/token
#   KUBECONFIG_STAGING  — Base64-encoded kubeconfig for staging cluster
#   KUBECONFIG_PROD     — Base64-encoded kubeconfig for production cluster
#   HELM_VALUES_STAGING — Base64-encoded values-staging.yaml overrides
#   HELM_VALUES_PROD    — Base64-encoded values-prod.yaml overrides

name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}
  IMAGE_PROXY: bulwark-gateway-proxy
  IMAGE_ADMIN: bulwark-gateway-admin
  HELM_RELEASE: bulwark-gateway
  NAMESPACE: bulwark-gateway

jobs:
  # ─── Stage 1: Lint & Test ────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e ".[admin,dev]"

      - name: Lint
        run: ruff check src/ tests/ admin/

      - name: Type check
        run: |
          mypy src/ --ignore-missing-imports
          mypy admin/ --ignore-missing-imports

      - name: Unit tests
        run: pytest tests/ -q --tb=short --ignore=tests/test_admin_integration.py

  # ─── Stage 1b: PostgreSQL Parity Tests ──────────────────────────────────────
  # The default `test` job exercises the admin stores on their SQLite fallback.
  # This job stands up a real PostgreSQL and runs the parity suite against it so
  # the dual-backend engine (placeholder translation, upsert rewrite, unique-
  # violation detection, transactions) is verified against live asyncpg — not
  # just string-level unit tests. Gates `build` alongside `test`.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bulwark
          POSTGRES_PASSWORD: bulwark
          POSTGRES_DB: bulwark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bulwark -d bulwark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BULWARK_TEST_POSTGRES_URL: postgresql://bulwark:bulwark@localhost:5432/bulwark_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e ".[admin,dev,postgres]"

      - name: PostgreSQL parity tests
        run: pytest tests/test_postgres_parity.py -v --tb=short

  # ─── Stage 2: Build & Push Images ───────────────────────────────────────────
  build:
    needs: [test, test-postgres]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.7.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build & push proxy image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198f0a7a9c4e02 # v5.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PROXY }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PROXY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198f0a7a9c4e02 # v5.3.0
        with:
          context: .
          file: docker/Dockerfile.admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ADMIN }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ADMIN }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 3: Deploy to Staging ─────────────────────────────────────────────
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v3.5
        with:
          version: "3.14.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          # Decode environment-specific values
          echo "${{ secrets.HELM_VALUES_STAGING }}" | base64 -d > /tmp/values-staging.yaml

          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm/bulwark-gateway \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --values /tmp/values-staging.yaml \
            --set proxy.image.tag=${{ needs.build.outputs.version }} \
            --set admin.image.tag=${{ needs.build.outputs.version }} \
            --wait \
            --timeout 5m

          # SECURITY FIX (VULN 4.4): Clean up decoded secrets from filesystem
          rm -f /tmp/values-staging.yaml

      - name: Post-deploy validation
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=proxy \
            -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=admin \
            -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Security smoke test (blocking)
        run: |
          PROXY_IP=$(kubectl get svc proxy -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
          kubectl run smoke-test --rm -i --restart=Never \
            --image=python:3.11-slim -n ${{ env.NAMESPACE }} -- \
            bash -c "pip install -q httpx && python /dev/stdin" < scripts/security-smoke-test.py

  # ─── Stage 4: Deploy to Production ──────────────────────────────────────────
  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v3.5
        with:
          version: "3.14.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          echo "${{ secrets.HELM_VALUES_PROD }}" | base64 -d > /tmp/values-prod.yaml

          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm/bulwark-gateway \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --values /tmp/values-prod.yaml \
            --set proxy.image.tag=${{ needs.build.outputs.version }} \
            --set admin.image.tag=${{ needs.build.outputs.version }} \
            --wait \
            --timeout 5m

          # SECURITY FIX (VULN 4.4): Clean up decoded secrets
          rm -f /tmp/values-prod.yaml

      - name: Post-deploy validation
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=proxy \
            -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=admin \
            -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Production smoke test (health + injection)
        run: |
          PROXY_IP=$(kubectl get svc proxy -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
          kubectl run prod-smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.6.0 -n ${{ env.NAMESPACE }} -- \
            sh -c "curl -sf http://${PROXY_IP}:8080/health | grep -q ok"

      - name: Notify deployment
        if: success()
        run: |
          echo "::notice::Production deployment successful — version ${{ needs.build.outputs.version }}"
