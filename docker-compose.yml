# ============================================================
# Bulwark Gateway — Docker Compose (Production-Hardened)
#
# ALL secrets are loaded from files in ./secrets/ directory.
# NO .env file needed in production.
#
# First deploy:
#   ./secrets/init.sh              # Auto-generates all secrets
#   docker compose up -d           # Start core services
#   docker compose --profile monitoring up -d  # + Prometheus
#   docker compose --profile full up -d        # + Grafana
#
# Secret rotation:
#   ./secrets/init.sh --force      # Regenerate all secrets
#   docker compose restart         # Apply new secrets
# ============================================================

# --- Project name (overrides directory-based default) ---
name: bulwark-gateway

# --- All secrets from files (auto-generated by secrets/init.sh) ---
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  admin_jwt_secret:
    file: ./secrets/admin_jwt_secret.txt
  admin_password:
    file: ./secrets/admin_password.txt
  security_password:
    file: ./secrets/security_password.txt
  auditor_password:
    file: ./secrets/auditor_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
  db_encryption_key:
    file: ./secrets/db_encryption_key.txt
  key_encryption_key:
    file: ./secrets/key_encryption_key.txt
  api_keys:
    file: ./secrets/api_keys.txt
  urlhaus_key:
    file: ./secrets/urlhaus_key.txt
  threatfox_key:
    file: ./secrets/threatfox_key.txt
  otx_key:
    file: ./secrets/otx_key.txt
  abuseipdb_key:
    file: ./secrets/abuseipdb_key.txt
  # Least-privilege static bearer used ONLY by Prometheus to scrape the admin
  # /admin/health/metrics endpoint (verified with hmac.compare_digest).
  metrics_scrape_token:
    file: ./secrets/metrics_scrape_token.txt

services:
  # ── Proxy (Hot Path) ─────────────────────────────────────
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BULWARK_PORT:-8080}:8080"
    environment:
      # Non-secret configuration only
      BULWARK_BACKEND_URL: ${BULWARK_BACKEND_URL:-http://host.docker.internal:8000}
      BULWARK_FAIL_MODE: ${BULWARK_FAIL_MODE:-closed}
      # Output filter: opt-in PII redaction (secrets/SSN/cards always redacted;
      # emails/phones are often legitimate agent output, so redaction is opt-in).
      BULWARK_REDACT_EMAIL: ${BULWARK_REDACT_EMAIL:-false}
      BULWARK_REDACT_PHONE: ${BULWARK_REDACT_PHONE:-false}
      # Admin-managed state read from the shared admin_data volume (see volumes).
      # Matches Helm: admin writes /app/data/{agents.yaml,iocs.json}; proxy reads
      # them here so UI-driven tenant/agent + IOC changes reach the hot path.
      # NOTE: main.py resolves the registry from BULWARK_AGENTS_CONFIG (settings
      # .agents_config); BULWARK_AGENTS_FILE is not a recognized setting, so the
      # proxy would silently fall back to the baked-in config/agents.yaml seed
      # (support-bot + code-assistant only) and ignore admin-managed agents.
      BULWARK_AGENTS_CONFIG: /app/shared/admin/agents.yaml
      BULWARK_IOC_PATH: /app/shared/admin/iocs.json
      BULWARK_LOG_FORMAT: json
      BULWARK_LOG_LEVEL: ${BULWARK_LOG_LEVEL:-INFO}
      BULWARK_RATE_LIMIT_RPM: ${BULWARK_RATE_LIMIT_RPM:-60}
      BULWARK_WORKERS: ${BULWARK_WORKERS:-1}
      BULWARK_TELEMETRY_ENABLED: ${BULWARK_TELEMETRY_ENABLED:-true}
      BULWARK_TELEMETRY_BATCH_SIZE: ${BULWARK_TELEMETRY_BATCH_SIZE:-100}
      BULWARK_TELEMETRY_FLUSH_INTERVAL: ${BULWARK_TELEMETRY_FLUSH_INTERVAL:-1.0}
      # SIEM stats/transports persistence (explicit; matches Helm + the siem_stats mount)
      BULWARK_SIEM_STATS_FILE: /app/shared/siem/siem_stats.json
      BULWARK_SIEM_TRANSPORTS_FILE: /app/shared/siem/siem_transports.json
      # ML Scanner configuration
      BULWARK_ML_ENABLED: ${BULWARK_ML_ENABLED:-false}
      BULWARK_ML_MODEL_DIR: /app/models
      BULWARK_ML_BLOCKING: ${BULWARK_ML_BLOCKING:-false}
      # Enrichment pipeline
      BULWARK_ENRICHMENT_ENABLED: ${BULWARK_ENRICHMENT_ENABLED:-true}
      BULWARK_REPLAY_DB_PATH: /app/shared/enrichment/attack_replay.db
      # Embedding scanner tunables (defaults mirror code + Helm values.yaml).
      # Kept identical to the admin service so its enrichment status report matches.
      BULWARK_EMBED_MODEL: ${BULWARK_EMBED_MODEL:-all-MiniLM-L6-v2}
      BULWARK_EMBED_THRESH_SUSPICIOUS: ${BULWARK_EMBED_THRESH_SUSPICIOUS:-0.78}
      BULWARK_EMBED_THRESH_THREAT: ${BULWARK_EMBED_THRESH_THREAT:-0.88}
      # Notification channels — admin writes, proxy reads (shared volume).
      # Without this the proxy uses its own ephemeral default and admin-configured
      # channels never fire alerts from the hot path.
      BULWARK_NOTIFICATIONS_FILE: /app/shared/notifications/channels.json
      # Response cache
      BULWARK_CACHE_ENABLED: ${BULWARK_CACHE_ENABLED:-true}
      BULWARK_CACHE_TTL: ${BULWARK_CACHE_TTL:-3600}
      BULWARK_CACHE_MAX_SIZE: ${BULWARK_CACHE_MAX_SIZE:-10000}
      # HuggingFace model cache (for sentence-transformers in enrichment)
      HF_HOME: /tmp/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /app/models/sentence-transformers
      # Secrets via _FILE env vars (read from /run/secrets/)
      BULWARK_JWT_SECRET_FILE: /run/secrets/jwt_secret
      BULWARK_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      BULWARK_API_KEYS_FILE: /run/secrets/api_keys
      BULWARK_KEY_ENCRYPTION_KEY_FILE: /run/secrets/key_encryption_key
      BULWARK_URLHAUS_KEY_FILE: /run/secrets/urlhaus_key
      BULWARK_THREATFOX_KEY_FILE: /run/secrets/threatfox_key
      BULWARK_OTX_KEY_FILE: /run/secrets/otx_key
      BULWARK_ABUSEIPDB_KEY_FILE: /run/secrets/abuseipdb_key
      # Redis URL without password (password injected by app from secret file)
      BULWARK_REDIS_URL: redis://redis:6379/0
    secrets:
      - jwt_secret
      - redis_password
      - api_keys
      - key_encryption_key
      - urlhaus_key
      - threatfox_key
      - otx_key
      - abuseipdb_key
    volumes:
      - policies:/app/config/policies:ro
      - ./models:/app/models:ro
      - telemetry_data:/app/data
      - siem_stats:/app/shared/siem
      - enrichment_data:/app/shared/enrichment
      # Notification channels: admin writes here, proxy only reads.
      - notifications_data:/app/shared/notifications:ro
      # Admin-managed state (agents registry + IOC DB): admin writes to its
      # /app/data (admin_data volume); proxy reads the SAME volume read-only at
      # /app/shared/admin. Mirrors the Helm shared admin-data PVC so tenant/agent
      # and IOC changes made in the admin UI actually reach the proxy hot path.
      - admin_data:/app/shared/admin:ro
    depends_on:
      redis:
        condition: service_healthy
      # Wait for admin to be healthy so it has seeded agents.yaml / iocs.json
      # into admin_data before the proxy loads them (avoids empty-registry race).
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # --- Security Hardening ---
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp/proxy.json
    # pids_limit set via deploy.resources.limits
    networks:
      - app-net
      - egress-net
      - monitor-net
    deploy:
      resources:
        limits:
          memory: ${PROXY_MEMORY_LIMIT:-1024M}
          cpus: "${PROXY_CPU_LIMIT:-2.0}"
        reservations:
          memory: 256M
          cpus: "0.5"

  # ── Admin Portal ─────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    ports:
      - "${ADMIN_PORT:-8090}:8090"
    environment:
      # Non-secret configuration only
      ADMIN_JWT_EXPIRY_HOURS: ${ADMIN_JWT_EXPIRY_HOURS:-8}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-}
      BULWARK_TELEMETRY_ENABLED: ${BULWARK_TELEMETRY_ENABLED:-true}
      BULWARK_REDIS_URL: redis://redis:6379/0
      BULWARK_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # IOC DB: admin persists to its writable admin_data volume (/app/data).
      # The proxy reads the same volume read-only at /app/shared/admin/iocs.json.
      # (Previously pointed at the read-only ./config bind, so admin writes failed.)
      BULWARK_IOC_PATH: /app/data/iocs.json
      # GDPR Art.30 controller / DPO identity (RoPA mandatory fields).
      # Leave unset to have the data-inventory endpoint honestly report
      # "NOT CONFIGURED" instead of a fabricated placeholder.
      BULWARK_GDPR_CONTROLLER: ${BULWARK_GDPR_CONTROLLER:-}
      BULWARK_GDPR_CONTROLLER_CONTACT: ${BULWARK_GDPR_CONTROLLER_CONTACT:-}
      BULWARK_GDPR_DPO_CONTACT: ${BULWARK_GDPR_DPO_CONTACT:-}
      # Cookie security: set to "false" for HTTP-only local dev (no TLS termination)
      BULWARK_HTTPS: "${BULWARK_HTTPS:-false}"
      # Enrichment DB (read-only access to proxy's replay DB)
      BULWARK_REPLAY_DB_PATH: /app/shared/enrichment/attack_replay.db
      # Enrichment status reporting — must mirror the proxy so /admin enrichment
      # status reflects the values the proxy hot path actually uses.
      BULWARK_ENRICHMENT_ENABLED: ${BULWARK_ENRICHMENT_ENABLED:-true}
      BULWARK_EMBED_MODEL: ${BULWARK_EMBED_MODEL:-all-MiniLM-L6-v2}
      BULWARK_EMBED_THRESH_SUSPICIOUS: ${BULWARK_EMBED_THRESH_SUSPICIOUS:-0.78}
      BULWARK_EMBED_THRESH_THREAT: ${BULWARK_EMBED_THRESH_THREAT:-0.88}
      # SkillSpector pre-deployment scanner tunables (defaults = code + Helm).
      BULWARK_SKILLSPECTOR_ENABLED: ${BULWARK_SKILLSPECTOR_ENABLED:-true}
      BULWARK_SKILLSPECTOR_BLOCK_THRESHOLD: ${BULWARK_SKILLSPECTOR_BLOCK_THRESHOLD:-7.0}
      BULWARK_SKILLSPECTOR_WARN_THRESHOLD: ${BULWARK_SKILLSPECTOR_WARN_THRESHOLD:-4.0}
      BULWARK_SKILLSPECTOR_TIMEOUT: ${BULWARK_SKILLSPECTOR_TIMEOUT:-60}
      BULWARK_SKILLSPECTOR_CACHE_TTL: ${BULWARK_SKILLSPECTOR_CACHE_TTL:-300}
      # Notification channels — admin writes, proxy reads (shared volume).
      # Same path in both services so admin-configured channels reach the hot path.
      BULWARK_NOTIFICATIONS_FILE: /app/shared/notifications/channels.json
      # Secrets via _FILE env vars
      ADMIN_JWT_SECRET_FILE: /run/secrets/admin_jwt_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SECURITY_PASSWORD_FILE: /run/secrets/security_password
      AUDITOR_PASSWORD_FILE: /run/secrets/auditor_password
      DB_ENCRYPTION_KEY_FILE: /run/secrets/db_encryption_key
      BULWARK_KEY_ENCRYPTION_KEY_FILE: /run/secrets/key_encryption_key
      BULWARK_PROXY_API_KEY_FILE: /run/secrets/api_keys
      # Prometheus scrape token — gates /admin/health/metrics with a dedicated
      # least-privilege bearer (empty file => endpoint remains admin:read only).
      BULWARK_METRICS_SCRAPE_TOKEN_FILE: /run/secrets/metrics_scrape_token
    secrets:
      - admin_jwt_secret
      - admin_password
      - security_password
      - auditor_password
      - db_encryption_key
      - key_encryption_key
      - api_keys
      - redis_password
      - metrics_scrape_token
    volumes:
      - policies:/app/config/policies
      - ./config/siem:/app/config/siem:ro
      # SECURITY FIX (APT-12): Mount as read-only to prevent IOC whitelist tampering
      # and backend route hijacking via container compromise
      - ./config/agents.yaml:/app/config/agents.yaml:ro
      - ./config/iocs.json:/app/config/iocs.json:ro
      - admin_data:/app/data
      - siem_stats:/app/shared/siem
      - reports:/app/reports
      - enrichment_data:/app/shared/enrichment
      # Notification channels: admin owns this file (read-write).
      - notifications_data:/app/shared/notifications
      - ./admin/main.py:/app/admin/main.py:ro
      - ./admin/templates:/app/admin/templates:ro
      - ./admin/routes:/app/admin/routes:ro
      - ./admin/services:/app/admin/services:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/admin/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # --- Security Hardening ---
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp/admin.json

    networks:
      - app-net
      - monitor-net
      - egress-net  # Required for host port publishing
    deploy:
      resources:
        # bcrypt (cost 12) login verification is single-threaded CPU-bound
        # (~250ms on one core). A 0.5 CPU cap causes cgroup throttling that
        # stretches each login ~10x (~9s). Allow a full core burst (2.0).
        limits:
          memory: ${ADMIN_MEMORY_LIMIT:-256M}
          cpus: "${ADMIN_CPU_LIMIT:-2.0}"

  # ── Redis (Rate Limiting + State) ───────────────────────
  redis:
    # SECURITY FIX (APT-10): Pin to specific version (mutable tag → immutable)
    image: redis:7.2.5-alpine
    command: >
      sh -c "echo \"requirepass $$(cat /run/secrets/redis_password)\" > /tmp/redis-auth.conf &&
      exec redis-server /tmp/redis-auth.conf
      --maxmemory ${REDIS_MAXMEMORY:-64mb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --rename-command CONFIG ''
      --rename-command DEBUG ''
      --rename-command MODULE ''
      --rename-command SLAVEOF ''
      --rename-command REPLICAOF ''
      --rename-command FLUSHALL ''
      --rename-command FLUSHDB ''"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      # SECURITY FIX (APT-05): Use REDISCLI_AUTH env var instead of -a flag
      # to prevent password exposure in /proc/PID/cmdline
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    # --- Security Hardening ---
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      # SECURITY FIX (APT-11): Removed DAC_OVERRIDE — Redis doesn't need
      # to bypass file permission checks. Data volume permissions are set correctly.
    security_opt:
      - no-new-privileges:true
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ── Prometheus (Monitoring) ─────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/web.yml:/etc/prometheus/web.yml:ro
      - prometheus_data:/prometheus
    secrets:
      # Bearer token for scraping the admin metrics endpoint
      # (referenced by prometheus.yml -> authorization.credentials_file).
      - metrics_scrape_token
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.config.file=/etc/prometheus/web.yml'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped
    # --- Security Hardening ---
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks:
      - monitor-net
    profiles:
      - monitoring
      - full
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Grafana (Dashboards) ────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    # --- Security Hardening ---
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks:
      - monitor-net
    profiles:
      - full
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  policies:
    driver: local
  redis_data:
    driver: local
  telemetry_data:
    driver: local
  admin_data:
    driver: local
  reports:
    driver: local
  siem_stats:
    driver: local
  enrichment_data:
    driver: local
  notifications_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  app-net:
    internal: true    # No internet access — internal communication only
  monitor-net:
    internal: true    # Prometheus/Grafana isolated network
  egress-net:
    driver: bridge    # Only proxy gets internet (for external backends)
