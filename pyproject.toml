[project]
name = "bulwark-gateway"
version = "1.0.0"
description = "Security guardrail proxy for AI agents — intercepts, validates, and enforces policies on tool calls between users and LLM agents in cloud environments"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    {name = "rokitoh"}
]

# SECURITY FIX (VULN 4.5): Use compatible-release (~=) or upper-bounded ranges
# to prevent auto-installation of unreviewed major versions.
# The requirements.lock file pins exact versions for reproducible builds.
# NOTE: upper bounds are kept one major above the version pinned in
# requirements.lock so pyproject and the lock agree (they had drifted: the lock
# ships redis 8, structlog 25, cachetools 7 — previously above the declared
# caps). The "no unreviewed major" intent is preserved via the upper bound.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.1,<26.0",
    "PyJWT>=2.8,<3.0",
    "redis>=5.0,<9.0",
    "cachetools>=5.3,<8.0",
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
skill-scanner = [
    "skillspector>=0.1",
]
admin = [
    "python-multipart>=0.0.9",
    # Async SQLite driver for the default admin backend. The engine degrades to
    # the stdlib `sqlite3` in a thread-executor when absent (see SQLiteEngine),
    # so this is an opt-in performance/concurrency upgrade, not a hard runtime
    # requirement — hence it lives here rather than in the core deps.
    "aiosqlite>=0.20,<1.0",
]
# PostgreSQL backend for the admin store (enterprise / HA multi-replica). Select
# it via BULWARK_ADMIN_DB_URL=postgresql://…; without this extra the admin runs
# on the default SQLite backend. Declared here (mirrors requirements-admin.lock)
# so the enterprise backend is an explicit, installable extra rather than an
# undocumented lock-only dependency.
postgres = [
    "asyncpg>=0.29,<1.0",
]
ml = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
]
# Provisioning-only extra for `scripts/download-models.py`: the ONNX artifacts
# (injection / toxicity / embeddings / NLI) are pulled from HuggingFace Hub, which
# needs the `huggingface-hub` client. This is NOT a runtime dependency — the proxy
# never imports it; it is only used offline/at-build-time to fetch + hash-pin
# models. Kept separate from `ml` so the runtime image stays free of the Hub
# client. `--fasttext` and `--verify` need nothing from this extra (stdlib only).
ml-provision = [
    "huggingface-hub>=0.23",
]
ml-gpu = [
    "onnxruntime-gpu>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
]
# Kept as an OPT-IN extra (NOT a core dependency) on purpose: the
# lingua-language-detector wheel is ~170 MB (it bundles n-gram models for every
# supported language), while the scanner it feeds (`language_detector`) is gated
# behind BULWARK_MULTILINGUAL_ENABLED, which is OFF by default. Shipping it in
# core would add 170 MB to every image for a default-off feature, breaking the
# minimal-distroless / zero-cost-when-disabled posture. Without this extra the
# detector still runs its script heuristic (CJK/Arabic/Cyrillic/… detected;
# Latin-script resolved to "en" at reduced confidence).
multilingual = [
    "lingua-language-detector>=2.0",
]
# Lightweight alternative to the `multilingual` (lingua) extra: fastText's
# language-ID backend needs only the ~2 MB compiled `fasttext` wheel plus the
# 917 KB lid.176.ftz model (provisioned via `download-models.py --fasttext`).
# Far smaller than lingua's 170 MB, and a much better default than the built-in
# Unicode-script heuristic. Still OPT-IN because `language_detector` is gated
# behind BULWARK_MULTILINGUAL_ENABLED (off by default).
fasttext = [
    "fasttext-wheel>=0.9.2",
]
vision = [
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
bulwark-gateway = "src.main:main"
bulwark-plugin = "src.plugins.cli:main"
bulwark-evaluate = "src.evaluation.cli:main"

# Scanner plugins register here. Third-party packages use:
# [project.entry-points."bulwark.scanners"]
# my_scanner = "my_package.module:MyScannerClass"
[project.entry-points."bulwark.scanners"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"src/guardrails/input_guardrail.py" = ["E501"]
"src/guardrails/output_filter.py" = ["E501"]
# E501: regex-heavy pattern catalogs — long alternations/character classes on a
# single line are more readable and less error-prone than wrapped fragments.
# Same rationale as the input_guardrail/output_filter pattern files above.
"src/guardrails/patterns/*" = ["E501"]
"src/scanners/multilingual/patterns.py" = ["E501"]
# Attack-payload corpora: long single-string adversarial payloads (encoded /
# zero-width / hex-escaped) where splitting would risk byte changes and hurt
# readability of the corpus — same rationale as the regex pattern files above.
"scripts/run-benchmarks.py" = ["E501"]
"scripts/pentest-guardrails.py" = ["E501"]
# S311: the red-team attack generator needs a *reproducible* (seeded) PRNG to
# synthesise adversarial payloads — this is deliberately non-cryptographic and
# never used for secrets/tokens.
"src/evaluation/attacks.py" = ["S311"]
# B008: FastAPI's `Depends()`/`Security()`-in-default is the framework-mandated
# idiom for dependency injection, not a mutable-default bug. Scoped to the route
# layers where it is pervasive and intentional.
"src/routes/*" = ["B008"]
"admin/routes/*" = ["B008"]
# auth_service hosts the FastAPI DI dependency factories (get_current_user,
# require_permission, require_role) that back every admin route — same
# Depends()-in-defaults idiom as the route modules themselves.
"admin/services/auth_service.py" = ["B008"]
# S101 (assert) is the pytest idiom; S105/S106 (test credential fixtures),
# S104 (bind-all in deployment-manifest assertions), S108/S306 (throwaway /tmp
# test paths) are all test-only constructs, never shipped.
"tests/*" = ["E501", "S101", "S104", "S105", "S106", "S108", "S306"]
"examples/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
